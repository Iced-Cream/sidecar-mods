Evidence, all static, 2026-09-26:
- the preceding instruction is `rts`;
- no 4-byte value at any even offset points into it, and no odd-offset match exists
  either; no disassembly operand outside it names an address in it;
- no reference from sections 1, 2, 5 or 8. The one match in the raw MAIN OS section
