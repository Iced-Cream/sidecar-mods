# Single source of truth for every scarce resource a mod can claim.
#
# All claims live here rather than in the individual mod.toml files, so that a
# collision between two mods is always a one-file diff. tools/layout.py asserts
# that no two claims overlap and that every claim sits inside its pool.
#
# owner = the mod directory name, or "reserved:<reason>".

[meta]
target = "OS1.74"

# ---------------------------------------------------------------------- pools

[[pool]]
name   = "cave"
start  = 0x402ccc80
end    = 0x402cd000          # exclusive; 1760 B
status = "verified"
note   = """
Verified on hardware 2026-09-16: mod 0001 put read-only strings here, and the
MICRO TIMING menu still read them correctly after the unit had been run. The region
is padding, not .bss, and later mods may put code and state here.

Found by `make cavescan` on this exact image, not inherited from
anyone's survey - there is no octamax equivalent for the Rytm.

Why this run and not a larger one: it is the only long zero run that ends the CODE
section. The 48 bytes before 0x402ccc7c disassemble as ColdFire and finish on an
`rts` (4e75), and the bytes after the run are UTF-16 string data ("Analog Rytm MKII
MIDI"), so this is alignment padding between .text and .rodata. The two much larger
runs the scan reports - 0x402cd89c +24452 and 0x402d4795 +21611 - sit between
pointer and float tables near the end of the image, which is exactly where a .bss
section would be placed, and .bss is written at runtime. That is the trap
octatrack-mods hit with its patch_ram pool: a region that scans as free on a stopped
machine and is overwritten the moment the engine runs.

The scan cannot tell padding from .bss. Before the first mod ships, prove this
region is untouched at runtime - fill it with a known pattern, flash, run the
machine hard, and read it back - and only then change status to "verified".
The run starts at 0x402ccc7c; this pool starts 4 bytes later to keep claims aligned.
"""

[[pool]]
name   = "cave2"
start  = 0x402cd8a0
end    = 0x402ce000          # exclusive; 1888 B
status = "probably-verified"
note   = """
Alignment padding between the last read-only data and the SRAM load image.

Hardware, 2026-09-19: 0003 ran from here with a 1520 B canary (380 words of
0xc0def00d) filling the rest of the pool. A diagnostic arm counted changed canary
words; the count read 0 straight after boot and still read 0 after a long session of
normal use, and 0003 kept working throughout. "Probably" because one session is not
exhaustive: paths nobody exercised, such as firmware transfer or factory test modes,
were not covered.

Evidence, all static:
- 0x402cd89c..0x402ce000 is 1892 B of zeros. The pool starts 4 bytes in, to keep
  claims aligned.
- The data just below is the C++ static-constructor table: count 146 at 0x402cd650
  and entries at 0x402cd654. The walker at 0x401006ee runs by count, not to a null,
  so the table ends at 0x402cd89c and nothing reads past it.
- Nothing in the image references an address in the gap. No code immediate and no
  32-bit data word points into 0x402cd660..0x402ce000; the highest reference in
  0x402cd000..0x402ce000 is the table itself, at 0x402cd654.
- 0x402ce000 is where the SRAM load images begin. The startup routine at 0x400007e4
  copies 0x402ce000..0x402d6000 to SRAM 0x80000000 and 0x402d6000..0x402ddff8 to
  0x80008000. The gap is below the first copy, and nothing else writes it.

This is why the large runs cavescan reports above 0x402ce000 (0x402cd89c +24452 past
this gap, 0x402d4795 +21611 and the 7 KB tail) are NOT free. They are the SRAM
sections' initial contents. The tail becomes the parameter arrays at 0x8000e434+.

Read-out caveat, found 2026-09-21 while adding mode 3: until then the diagnostic
answered the raw count, and vel_text_gate turns a dial value back into one of sixteen
amounts, so counts of 1..4 all printed as "0". The reading above therefore means
"fewer than 5 words changed", not "exactly none". It does not overturn the result - a
live .bss region would have shown far more than four changed words, and the popup
would have read a large amount - but it is weaker than the note claimed. 0003 now
answers the stop for index min(count, 15), so any non-zero count reads non-zero; a
re-run would give the exact-zero evidence this never had.

"""

