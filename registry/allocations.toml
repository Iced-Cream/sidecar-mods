expect_sha256 = "c695aff3616ebdbe12943e753ff771162d68c43187e00c41a39e1581b07233ba"
status = "probably-verified"
note   = """
An unreachable routine, and the largest single run of free space in the image - it is
bigger than cave2, and unlike every other pool here it is in .text, among the code
that would call into it.

Found by `make cavescan` on this exact image, which reports it as two regions,
0x4002905e +802 and 0x4002954a +752, because the 458 B between them do not begin
after a terminator. They are one routine. The whole span 0x4002905e..0x4002983a was
then checked directly: 2012 B with no external reference of any kind. The pool starts
2 bytes in and ends 2 bytes early to keep claims 4-byte aligned.

Evidence, all static:
- 0x4002905c is `rts`, so nothing falls into 0x4002905e.
- 0x4002905e is a textbook prologue - `lea %sp@(-132),%sp` then
  `moveml %d2-%d7/%a2-%fp,%sp@` - so this is a routine start, not a fragment.
- No 4-byte value at any even offset in the image points anywhere into the span, and
