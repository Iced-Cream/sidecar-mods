  in the whole image, 0x40106d17 -> 0x40029442 and 0x4011e701 -> 0x40029420, are both
  at ODD offsets, inside other instructions' encodings, and cannot be pointers.
- The nearest computed jump table below it is at 0x4001f9ea, 0x9674 B away. A 16-bit
  unsigned offset reaches 0xffff, so that table CAN span it - it resolves cleanly, and
  none of its arms land here.
- Sections 1, 2 and 8 contain no reference into it, big- or little-endian.

The routine continues past 0x4002983a; the pool stops there because that is the first
address in it that anything references, and there is no reason to argue past the
boundary the scan can defend.

Hardware, 2026-09-21: 0007-cave-probe filled the whole pool with the entry ladder and
0003's diag_canary = 3 read the counter back. The count read 0 after a session of
playback, pattern switching, and entering and leaving sample mode.

The control ran first and is what makes that 0 mean anything: the same image with the
counter seeded to 3 read 3 on the popup, so the read-out path was known good before
the real run. The two images differ at exactly one byte, 0x402ccfab.

"Probably" for the same reason as cave2 and cave3, and the list of what was not
covered is longer here than the session suggests: no provoked error paths, no factory
or test modes, no OS upgrade, and within normal use no actual sampling, no +Drive
access and no Overbridge. What carries this pool is the static case, not the session -
see the five routes ruled out in the dead-code preamble above, and the attribution.
"""

