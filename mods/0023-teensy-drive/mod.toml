[mod]
id      = "0023-teensy-drive"
title   = "teensy-drive: the Sidecar's card as a folder SIDECAR in the Rytm's own file browser"

enabled = false

# code in elekloader's DDR area, a client of the companion (0032-sidecar): its router brings the Pi's 0E listings
area    = "elek"

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
GLOBAL > SAMPLES (and the other +Drive browsers) list a folder SIDECAR after the +Drive's own: the Pi's card
(/Samples), browsed with the browser's own keys, folders and files with sizes. Served by wrapping the filesystem's
readdir, node resolve, exists and the two size functions for ids 0x7E......; the +Drive's own entries untouched;
nothing written (the milestone 4 guards). Listings from the Pi's card browse service (0D -> 0E, sidecar-firmware
core/browse), asked with core-ar2's core_midi_try_send, answered through the companion's router. A companion client
on core-ar2 0.13 since 2026-11-10 (design.md, "On the companion"). LOAD TO PROJ on SIDECAR files adds them to the
project's sample pool on the Pi (the companion's sc_sample_add_ref, 51 3D SADDB), which DSP SAMPLE plays.
"""

[sources]
stub = "stub.s"      # generated from teensy_drive.c by build.sh

[params]

[elek]
core = "core-ar2"
subscribe = [
  { event = "ev_tick", fn = "td_tick", order = 80 },
]

[requires]
shared = false
symbols = []
mods = ["0032-sidecar"]

# The Pi's 0E listings, through the companion's router straight to td_sysex.
[[sidecar.cmds]]
first   = 0x0e
last    = 0x0e
handler = "td_sysex"
