[mod]
id      = "0022-looper"
title   = "Looper mode: TRK + REC, pads as clip slots for an Overbridge host's master looper"

enabled = false

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
TRK + REC toggles looper mode. In it, the 12 pads are clip slots (UP/DOWN pages
of 12) and their presses go to the USB host as SysEx (F0 7D 52 54 06 slot down F7;
mode and page: 05 on page) instead of the Rytm; with TRK held the pads keep their
stock action. The host (a Teensy, rytm-teensy) records the master out and loops
it, quantised to bars from the Rytm's MIDI clock. Hooks the UI loop's call of
key_dispatch. Emulator only (rytm-emu, 2026-10-08).
"""

[sources]
stub = "stub.s"      # generated from looper.c by build.sh

[requires]
shared = false
symbols = []
mods = ["0032-sidecar"]   # the companion's router passes it the host's 07 / 08 (its table sc_cmds)

[params]
# keys: 1 (default) hooks TRK + REC, the pads, the panel writer and the LED selector (looper mode).
# 0: no key, pad or LED hook - the looper is unreachable and [YES]/key_dispatch is stock (user, 2026-10-15:
# the looper needs another key combo); the host's 07 / 08 still reach looper_host through the companion.
keys = 1
# sfx: 1 the looper's reports never wait on USB (a try-lock of the MIDI mutex, as 0026); 0 (default): they wait, as before.
# (Until the companion phase, 2026-11-03, sfx / rui / fxin / slots also chose which clients this mod's router passed
# messages to; each client registers its own commands with mods/0032-sidecar now.)
sfx = 0

# The host commands this mod takes, in the companion's table (mods/0032-sidecar, tools/build.py).
[[sidecar.cmds]]
first   = 0x07
last    = 0x08
handler = "looper_host"     # called for every 07 / 08 (SC_DIRECT)
