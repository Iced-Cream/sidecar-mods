[mod]
id      = "0032-sidecar"
title   = "Sidecar companion (built from its own repository, sidecar-core): the host link's SysEx router and services"

enabled = false

# The companion's source moved to its own repository on 2026-11-05: https://github.com/Iced-Cream/sidecar-core,
# pinned in the Makefile (SC_REV) and cloned to vendor/sidecar-core by `make setup`. It is an ordinary elekloader mod
# there (id `sidecar`, companion/mod.src.json); tools/build.py builds it with sidecar-core's tools/build.py and links
# its elemod beside core-ar2 and this tree's mods. This entry stays so the rest of the tree can name it: the
# registry's claims (core-ar2's eight sites, written by elekloader; from core-ar2 0.11 the companion has no sites of its
# own), [[sidecar.cmds]] for the overlap check, and `requires` from the client mods.
area     = "elek"
external = "sidecar-core"

# The companion also carries the elekloader build itself (once mod 0027, folded in 2026-11-04): core-ar2's eight
# sites in the registry (foreign patches) are its claims. sidecar-core's companion/elekloader.md.

# core-ar2 hooks the UI loop's key dispatch call (0x400a47cc) for ev_key; 0022's keys=1 patches the same call's operand
# (looper_key). Use ev_key instead. The step clock takes the two sites 0026 uses with screen=0 (its seq link): build 0026
# with screen=1. (From core-ar2 0.11 the step clock is on core's sequencer events; core itself holds the clock's exit.)
excludes_params = ["0022-looper:keys", "0026-remote-ui:!screen"]

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
The companion every Sidecar client mod goes through, built from sidecar-core. It takes each host SysEx
message F0 7D 52 54 <cmd> ... F7 through core-ar2 0.11's ev_sysex_in and calls the mod that registered <cmd> in its
table sc_cmds (a client's mod.toml [[sidecar.cmds]], built by the linker). Its own services: the store
link (51: the Pi's records and parameter locks, the project's ID, name and a handle per pattern, the
kit's record, each sound's record) and the step clock (2C / 2D). sidecar-core's companion/design.md.
"""

[elek]
# the elekloader core every build links against (vendor/elekloader/mods/<core>; build.py ELEK_CORE_*)
core = "core-ar2"

[requires]
shared = false
symbols = []
mods = []

# The companion's own command (sidecar-core companion/mod.src.json contributes it): listed here for the overlap
# check only, never contributed again (external).
[[sidecar.cmds]]
first   = 0x51
last    = 0x51
handler = "sc_store_host"
