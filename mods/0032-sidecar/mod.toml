[mod]
id      = "0032-sidecar"
title   = "Sidecar companion: the host link's SysEx router; mods register their commands in its table sc_cmds"

enabled = false

# code in elekloader's DDR area (needs 0027-elekloader); its own elemod, `sidecar`, in release builds
area    = "elek"

# 0024-ob-mix (ob-fx branch) patches the same two jsr operands as the FX return; 0006's telemetry and calibration
# builds write the same words 10/11.
excludes = ["0006-comp-preview"]

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
The companion every Sidecar client mod goes through. It takes each host SysEx message
F0 7D 52 54 <cmd> ... F7 at the router's entry, before stock routes it, and calls the mod that
registered <cmd> in the table sc_cmds (mod.toml [[sidecar.cmds]], built by the linker); the
mailbox form keeps 0022's rule that a mod hears its commands only once its mailbox holds its
magic. Replaces 0022's router (companion phase, 2026-11-03); host traffic is unchanged. design.md.

Its own service, the FX return (once mod 0030-fx-in, fx-return.md): off at boot (AUDIO IN on Overbridge
channels 10/11, as stock). The host sends 26 01 (on) / 26 00 (off) / 26 7F (ask); the Rytm answers 27 <0|1>,
and sends one unasked each time its USB port comes up. On, channels 10/11 carry the delay + reverb return at
the MIX page's return levels. Back to off when the port goes down. Also the mix report for the Sidecar's
through mode (50: the 8 stems' pans and the route byte), on a change and once a second.
"""

[sources]
stub = "stub.s"      # generated from sidecar.c by build.sh

[elek]
collections = { sc_cmds = 12 }
subscribe = [{ event = "ev_tick", fn = "fxin_tick", order = 75 }]

[requires]
shared = false
symbols = ["fx_return_gain_pre", "fx_return_gain_post", "fx_delay_out", "fx_reverb_out", "ob_in_write", "lfo_track_array"]
mods = []

# The companion's own command: FX IN (26).
[[sidecar.cmds]]
first   = 0x26
last    = 0x26
handler = "fxin_host"       # called for every 26 (SC_DIRECT)
